services:
  spring:
    build:
      dockerfile: docker/java/Dockerfile
    container_name: spring
    # `condition: service_healthy`, not a bare list. A bare `depends_on` waits for the mongo
    # CONTAINER to start, not for mongod to accept connections, so the app raced its own database
    # on every cold start. The mongo healthcheck below is what makes the condition mean something.
    depends_on:
      mongo:
        condition: service_healthy
    # Acts on the process EXITING. Verified rather than assumed: SIGKILL to pid 1 took RestartCount
    # from 0 to 1 and the container came back healthy.
    #
    # It does NOT act on `unhealthy` -- Docker's restart policies read exit codes, not health, and
    # restart-on-unhealthy needs swarm, an orchestrator or an external watcher. So the HEALTHCHECK
    # in docker/java/Dockerfile buys VISIBILITY here (`docker ps` says unhealthy, and a monitor can
    # scrape it), while this line buys recovery from a crash. Saying the pair auto-heals a wedge
    # would overstate it, and a comment that overstates a guard mis-ranks what matters next.
    restart: unless-stopped
    deploy:
      replicas: 1
    # `:?` makes compose refuse to start when the variable is unset, instead of
    # silently substituting an empty string. Set these in an untracked .env.local
    # or export them; never commit their values.
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (see .env.example)}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI (see .env.example)}
      # OpenAPI docs stay off unless explicitly switched on. Never enable them in production:
      # they publish the full API shape of a service whose every other route is authenticated.
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-false}
    expose:
      - 80
    image: task-manager-spring:latest
    networks:
      - network
    ports:
      - "80:80"

  mongo:
    build:
      dockerfile: docker/mongo/Dockerfile
    container_name: mongo
    restart: unless-stopped
    # What `depends_on: condition: service_healthy` above actually waits on. `mongosh --eval` with
    # a ping is the cheapest statement that proves mongod is ACCEPTING queries rather than merely
    # running; `--quiet` keeps the output out of the compose log on every interval.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      replicas: 1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME (see .env.example)}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD (see .env.example)}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?set MONGO_APP_USERNAME (see .env.example)}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD (see .env.example)}
    expose:
      - 27017
    image: task-manager-mongo:latest
    networks:
      - network
    # No ports mapping. `expose: 27017` above already reaches mongo from the app over the
    # compose network, which is the only client. Publishing it bound the database to every
    # host interface, so anything that could reach the host could reach mongo directly,
    # credentials being the only thing in the way. Add a mapping back only if you need a
    # local shell, and prefer 127.0.0.1:27017:27017 so it is not on the network.
    volumes:
      - ./docker/mongo/init/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

networks:
  network:
    attachable: true
    # `overlay` is a swarm-mode driver: `docker compose up` on a plain daemon fails
    # at network creation with "This node is not a swarm manager".
    driver: bridge
