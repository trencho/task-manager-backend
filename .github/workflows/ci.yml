name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (JDK 25)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Java 25 (current LTS). javac 23+ no longer runs annotation processors found only on the
      # classpath, so the pom declares Lombok and MapStruct explicitly via annotationProcessorPaths
      # (maven-compiler-plugin) — that, not a version pin, is what keeps the generated code building.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        # ubuntu-latest runners ship a running Docker daemon, which the Testcontainers
        # -backed TaskControllerIntegrationTest needs. Testcontainers is NOT pinned in the
        # pom -- the Spring Boot BOM manages it, currently 2.0.5. Read the resolved version
        # with `./mvnw help:evaluate -Dexpression=testcontainers.version` rather than trusting
        # a number written here; this comment claimed 1.21.4, which was never true.
        run: ./mvnw -B clean verify

      # The Dockerfile was UNBUILDABLE from the Boot 4 migration until 2026-09-06 and nothing
      # noticed, because nothing here built it: the extract stage ran `-Djarmode=layertools`,
      # which Boot 4 removed, and every `docker build` died. `./mvnw verify` cannot see that --
      # the jar is fine, it is the image that is not.
      #
      # No push and no registry login: this repo publishes nothing. The point is only that the
      # Dockerfile is exercised on every PR, so the next removed flag fails here rather than the
      # next time somebody needs an image.
      - name: Build the container image
        run: docker build -f docker/java/Dockerfile -t task-manager-spring:ci .

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
