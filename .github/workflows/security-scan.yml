name: Security scan

# Weekly OSV vulnerability scan, deliberately decoupled from the CI / merge gate: a newly-published
# advisory surfaces as a scheduled red (and notifies the owner) without ever blocking a PR. Dependabot
# opens upgrade PRs; this answers the other question — "is a CVE out against what we already ship?"
on:
  schedule:
    - cron: "39 7 * * 1" # weekly, Monday 07:39 UTC - fleet slot (minutes staggered per repo)
  # No `push` trigger, deliberately. A push to master is a squash of the tree the `pull_request`
  # run checked minutes earlier, so it re-answered a question already answered. This repo is
  # public and Actions minutes are unlimited here, so the reason is redundancy rather than cost --
  # the same change on the two private repos was made to stop the account's free minutes running
  # out, and this one keeps the fleet's scans on one shape.
  #
  # The two triggers that remain each cover something nothing else does: `pull_request` catches a
  # dependency arriving with a known advisory BEFORE it lands; `schedule` catches a dependency
  # already here that became vulnerable, which no code-change trigger can see.
  #
  # The gap this accepts, named rather than left to be discovered: a dependency change pushed
  # DIRECTLY to master, bypassing a PR, is unscanned until the weekly run. Dependencies here arrive
  # through Dependabot PRs, and Dependabot's own alerts cover that case independently.
  #
  # NOT done in trencho.github.io, on purpose: that scan uploads SARIF to the Security tab, so its
  # push run is what refreshes -- and CLOSES -- default-branch code-scanning alerts. This scan
  # uploads nothing, so dropping push costs it no signal.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scan:
    name: OSV scan (CycloneDX SBOM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pin the SAME JDK as CI (25) so SBOM resolution matches the real build — a stale JDK here
      # (drifting from ci.yml) breaks the scan, since the project targets Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Resolve the full dependency graph into target/bom.json. We scan this SBOM, not pom.xml,
      # because OSV's live Maven resolver can choke on Spring Boot BOM-managed transitive versions —
      # the SBOM carries the actually-resolved versions.
      - name: Generate CycloneDX SBOM
        run: ./mvnw -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DoutputName=bom

      # Pinned to an exact tag: the composite scanner action's behaviour can shift in minor updates.
      # osv-scanner.toml records the single accepted, upstream-unfixed advisory, so this goes red only
      # when a *new* one lands.
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --config=osv-scanner.toml
            -L
            target/bom.json
